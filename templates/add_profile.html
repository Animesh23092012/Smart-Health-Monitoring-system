
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Family Member | Smart Health</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b1120;
            color: white;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .box {
            background: #172033;
            border: 1px solid #334155;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 460px;
        }

        h1 {
            color: #38bdf8;
            font-size: 25px;
        }

        p {
            color: #94a3b8;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0b1120;
            color: white;
        }

        button, a {
            display: inline-block;
            padding: 13px 16px;
            border: none;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            cursor: pointer;
            margin-top: 22px;
            font-size: 14px;
        }

        button {
            background: #0284c7;
        }

        button:hover {
            background: #0369a1;
        }

        a {
            background: #334155;
            margin-left: 5px;
        }

        .error {
            color: #fca5a5;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Add Family Member</h1>

    <p>
        Create a separate health profile for a family member.
    </p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <label>Full Name</label>

        <input
            type="text"
            name="name"
            maxlength="80"
            placeholder="Enter full name"
            required
        >

        <label>Date of Birth</label>

        <input
            type="date"
            name="date_of_birth"
            id="dob"
            required
        >

        <label>Relationship</label>

        <select name="relationship" required>
            <option value="">Choose relationship</option>
            <option value="Child">Child</option>
            <option value="Parent">Parent</option>
            <option value="Grandparent">Grandparent</option>
            <option value="Spouse">Spouse</option>
            <option value="Other">Other</option>
        </select>

        <button type="submit">
            Create Profile
        </button>

        <a href="{{ url_for('profiles') }}">
            Cancel
        </a>

    </form>

</div>

<script>
    document.getElementById("dob").max =
        new Date().toISOString().split("T")[0];
</script>

</body>
</html>
