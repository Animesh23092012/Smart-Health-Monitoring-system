<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Smart Health</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b1120;
            color: white;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .box {
            background: #172033;
            border: 1px solid #263449;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 420px;
        }

        h1 {
            color: #38bdf8;
            font-size: 25px;
        }

        p {
            color: #94a3b8;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0b1120;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #0369a1;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }

        .error {
            color: #fca5a5;
            margin-top: 15px;
        }

        .hint {
            font-size: 12px;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Create Account</h1>

    <p>
        Join Smart Health Monitoring System and manage
        your personal or family health profiles.
    </p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <label>Full Name</label>
        <input
            type="text"
            name="name"
            maxlength="80"
            placeholder="Enter your full name"
            required
        >

        <label>User ID</label>
        <input
            type="text"
            name="user_id"
            maxlength="40"
            placeholder="Create a user ID"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            minlength="10"
            placeholder="Minimum 10 characters"
            required
        >

        <label>Email Address</label>
        <input
            type="email"
            name="email"
            maxlength="120"
            placeholder="Enter your email address"
        >

        <label>Phone Number</label>
        <input
            type="tel"
            name="phone"
            maxlength="20"
            placeholder="Enter your phone number"
        >

        <p class="hint">
            At least one contact method is required.
            You can provide your email, phone number, or both.
        </p>

        <button type="submit">Create My Account</button>

    </form>

    <p style="margin-top: 22px; text-align: center;">
        Already have an account?
        <a href="{{ url_for('login') }}">Login</a>
    </p>

</div>

</body>
</html>
